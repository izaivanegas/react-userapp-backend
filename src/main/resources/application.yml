spring:
  application:
    name: backend-usersapp

  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/backend-userapp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:izai}
    password: ${DB_PASSWORD:vanegas}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

    defer-datasource-initialization: true


  sql:
    init:
      mode: always
      platform: mysql
      continue-on-error: false


app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173, http://localhost:3000}



# Logging para ver la ejecución
logging:
  level:
    org.springframework.jdbc.datasource.init: INFO
    org.hibernate.SQL: INFO

server:
  port: ${SERVER_PORT:8080}


